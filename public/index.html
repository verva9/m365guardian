<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Connect a Microsoft 365 tenant and get a scored security report in minutes: the same recurring misconfigurations manual audits find, checked automatically with read-only permissions.">
<meta property="og:title" content="M365 Guardian - Microsoft 365 security scan">
<meta property="og:description" content="Free scan for the common M365/Entra misconfigurations manual audits keep finding.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 1.5l8.5 3.2v6.1c0 5.6-3.6 9.7-8.5 11.7-4.9-2-8.5-6.1-8.5-11.7V4.7L12 1.5z' fill='%234F46E5'/%3E%3Cpath d='M8 12.3l2.7 2.7 5.3-5.8' stroke='white' stroke-width='1.9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>M365 Guardian - Microsoft 365 security scan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#ffffff;
    --bg-soft:#f7f8fb;
    --panel:#ffffff;
    --line:#e6e8ef;
    --text:#14161f;
    --text-dim:#65697a;
    --accent:#4F46E5;
    --accent-dark:#4338CA;
    --accent-soft:#eeecfd;
    --good:#0f9d58;
    --good-soft:#e7f7ee;
    --bad:#d93025;
    --bad-soft:#fdecea;
    --warn:#b8860b;
    --warn-soft:#fdf3e0;
    --info:#65697a;
    --info-soft:#f1f2f6;
    --shadow:0 1px 2px rgba(20,22,31,.04), 0 8px 24px rgba(20,22,31,.06);
    --shadow-sm:0 1px 2px rgba(20,22,31,.06);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg-soft);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15.5px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  code, .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  a{color:var(--accent);}

  .top{
    background:var(--bg);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:10;
  }
  .top-inner{max-width:760px;margin:0 auto;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-weight:800;font-size:16.5px;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px;}
  .brand a{color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;}
  .brand svg{flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(79,70,229,.25));}

  .hero-wrap{position:relative;}
  .hero-glow{
    position:absolute;top:-120px;left:50%;transform:translateX(-50%);
    width:640px;height:360px;pointer-events:none;z-index:-1;
    background:radial-gradient(closest-side, rgba(79,70,229,.14), rgba(79,70,229,0) 72%);
  }

  .wrap{max-width:760px;margin:0 auto;padding:44px 20px 80px;position:relative;}

  #app > *{animation:fadeInUp .5s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  h1{font-size:32px;font-weight:800;margin:0 0 14px;line-height:1.26;letter-spacing:-0.02em;}
  h2{font-size:19px;font-weight:700;margin:44px 0 14px;letter-spacing:-0.01em;}
  p{margin:0 0 12px;}

  .lede{color:var(--text-dim);max-width:540px;margin-bottom:26px;font-size:16.5px;}

  .btn{
    font-weight:600;font-size:14.5px;
    background:var(--accent);color:#fff;border:none;border-radius:9px;
    padding:12px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    box-shadow:0 1px 2px rgba(79,70,229,.15), 0 4px 12px rgba(79,70,229,.22);
    transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{background:var(--accent-dark);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.55;cursor:default;transform:none;}
  .btn.subtle{
    background:#fff;color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  }
  .btn.subtle:hover{background:var(--bg-soft);}
  .link-btn{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:14px;padding:0;font-family:inherit;}
  .link-btn:hover{text-decoration:underline;}

  .note{font-size:13.5px;color:var(--text-dim);margin:14px 0;}
  .note a{color:var(--text-dim);text-decoration:underline;}

  .error-banner{
    background:var(--bad-soft);border:1px solid #f3c6c1;color:#8f241b;
    padding:12px 16px;border-radius:10px;font-size:14px;margin-bottom:20px;
  }

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px 24px;
  }

  .checks-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 24px;}
  @media(max-width:600px){ .checks-grid{grid-template-columns:1fr;} }
  .check-card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;box-shadow:var(--shadow-sm);
  }
  .check-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;}
  .check-card h4{font-size:14px;font-weight:600;margin:0;line-height:1.35;}

  .pill{
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;
    padding:3px 9px;border-radius:99px;flex-shrink:0;white-space:nowrap;
  }
  .pill.critical{background:var(--bad-soft);color:var(--bad);}
  .pill.high{background:var(--warn-soft);color:var(--warn);}
  .pill.medium{background:var(--warn-soft);color:var(--warn);}
  .pill.low{background:var(--good-soft);color:var(--good);}
  .pill.info{background:var(--info-soft);color:var(--info);}

  .score-card{
    display:flex;align-items:center;gap:22px;margin-bottom:22px;flex-wrap:wrap;
  }
  .score-ring{
    width:92px;height:92px;border-radius:50%;flex-shrink:0;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--ring-c, var(--line)) calc(var(--pct, 0) * 1%), var(--line) 0);
  }
  .score-ring::before{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--panel);}
  .score-ring span{position:relative;z-index:1;font-size:25px;font-weight:800;}
  .score-ring.good{color:var(--good);}
  .score-ring.warn{color:var(--warn);}
  .score-ring.bad{color:var(--bad);}
  .score-ring.info{color:var(--info);font-size:13px;}
  .score-meta{flex:1;min-width:200px;}
  .score-meta h2{margin:0 0 3px;font-size:18px;}
  .score-meta p{margin:0;color:var(--text-dim);font-size:13.5px;}
  .score-delta{
    font-size:12.5px;font-weight:700;margin-top:8px;display:inline-block;
    padding:3px 10px;border-radius:99px;
  }
  .score-delta.up{color:var(--good);background:var(--good-soft);}
  .score-delta.down{color:var(--bad);background:var(--bad-soft);}
  .score-delta.flat{color:var(--text-dim);background:var(--info-soft);}

  .trend-row{display:flex;align-items:flex-end;gap:3px;height:30px;margin-top:10px;}
  .trend-bar{width:6px;border-radius:2px 2px 0 0;background:var(--line);}
  .trend-bar.good{background:var(--good);}
  .trend-bar.warn{background:var(--warn);}
  .trend-bar.bad{background:var(--bad);}

  .findings{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
  .finding{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;box-shadow:var(--shadow-sm);
    border-left:3px solid var(--line);
  }
  .finding.fail{border-left-color:var(--bad);}
  .finding.pass{border-left-color:var(--good);}
  .finding-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .status-dot{
    width:20px;height:20px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
  }
  .status-dot.pass{background:var(--good-soft);color:var(--good);}
  .status-dot.fail{background:var(--bad-soft);color:var(--bad);}
  .status-dot.na{background:var(--info-soft);color:var(--info);}
  .finding-title{font-weight:600;font-size:14.5px;flex:1;}
  .finding-detail{color:var(--text-dim);font-size:13.8px;margin:0 0 8px;}
  .finding-remediation{
    font-size:13.5px;background:var(--accent-soft);border-radius:8px;
    padding:9px 12px;color:var(--accent-dark);
  }

  .footer-row{
    margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:8px;
  }
  .footer-row button{
    background:#fff;border:1px solid var(--line);color:var(--text);border-radius:8px;
    cursor:pointer;font-size:13px;font-family:inherit;padding:7px 13px;font-weight:500;
    box-shadow:var(--shadow-sm);
  }
  .footer-row button:hover{background:var(--bg-soft);}
  .footer-row button.danger{color:var(--bad);}

  .loading{color:var(--text-dim);padding:50px 0;font-size:15px;text-align:center;}
  .spinner{
    width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .faq{margin-top:16px;}
  .faq-item{border-bottom:1px solid var(--line);padding:16px 0;}
  .faq-item:first-child{padding-top:0;}
  .faq-item dt{font-weight:600;font-size:14.5px;margin-bottom:5px;}
  .faq-item dd{margin:0;color:var(--text-dim);font-size:14px;}

  .pricing-row{display:flex;gap:16px;margin:16px 0 24px;flex-wrap:wrap;}
  .pricing-col{
    flex:1;min-width:230px;border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;background:var(--panel);box-shadow:var(--shadow-sm);
  }
  .pricing-col.highlight{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), var(--shadow);position:relative;overflow:visible;}
  .pricing-col.highlight::before{
    content:'Most popular for MSPs';position:absolute;top:-11px;left:20px;
    background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;
    padding:3px 10px;border-radius:99px;letter-spacing:0.02em;
  }
  .pricing-col .price{font-size:26px;font-weight:800;margin:2px 0 10px;letter-spacing:-0.01em;}
  .pricing-col .price span{font-size:13px;font-weight:500;color:var(--text-dim);}
  .pricing-col h3{margin:0 0 2px;font-size:14px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.03em;}
  .pricing-col ul{margin:0;padding-left:18px;font-size:13.8px;color:var(--text-dim);}
  .pricing-col li{margin-bottom:5px;}

  @media print{
    body{background:#fff;color:#111;}
    .top,.footer-row,#mspLinkResult,.btn,.note{display:none !important;}
    .finding,.card{border-color:#ccc;box-shadow:none;}
    .finding-detail{color:#333;}
    .finding-remediation{background:#f2f2f2;color:#111;}
  }

  /* ---- MSP dashboard ---- */
  .dash-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
  .dash-head h1{margin:0;font-size:24px;}
  .dash-key-note{font-size:13.5px;color:var(--text-dim);margin-bottom:18px;}
  .dash-table{display:flex;flex-direction:column;gap:8px;}
  .dash-row{
    border:1px solid var(--line);border-radius:10px;background:var(--panel);
    padding:13px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);
  }
  .dash-score{
    width:42px;height:42px;flex-shrink:0;border-radius:50%;border:4px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;
  }
  .dash-score.good{border-color:var(--good);color:var(--good);}
  .dash-score.warn{border-color:var(--warn);color:var(--warn);}
  .dash-score.bad{border-color:var(--bad);color:var(--bad);}
  .dash-score.na{border-color:var(--info);color:var(--info);font-size:9px;}
  .dash-info{flex:1;min-width:0;}
  .dash-info h4{margin:0 0 2px;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dash-info p{margin:0;color:var(--text-dim);font-size:12.5px;}
  .dash-actions{display:flex;gap:12px;flex-shrink:0;align-items:center;font-size:13px;}
  .dash-actions a{color:var(--accent);text-decoration:none;font-weight:600;}
  .dash-actions button{background:none;border:none;color:var(--text-dim);text-decoration:underline;cursor:pointer;font-size:12.5px;font-family:inherit;}
  .empty-dash{color:var(--text-dim);padding:40px 20px;font-size:14.5px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);}

  .msp-link-box{
    margin-top:16px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;font-size:13.5px;color:var(--text-dim);box-shadow:var(--shadow-sm);
  }
  .msp-link-box code{color:var(--text);background:var(--bg-soft);border:1px solid var(--line);border-radius:5px;padding:2px 6px;word-break:break-all;}
</style>
</head>
<body>
<div class="top">
  <div class="top-inner">
    <div class="brand"><a href="/">
      <svg width="26" height="26" viewBox="0 0 24 24">
        <path d="M12 1.5l8.5 3.2v6.1c0 5.6-3.6 9.7-8.5 11.7-4.9-2-8.5-6.1-8.5-11.7V4.7L12 1.5z" fill="url(#shieldGrad)"/>
        <path d="M8 12.3l2.7 2.7 5.3-5.8" stroke="white" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <defs><linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#4F46E5"/><stop offset="1" stop-color="#4338CA"/>
        </linearGradient></defs>
      </svg>
      M365 Guardian
    </a></div>
  </div>
</div>
<div class="wrap">
  <div class="hero-glow"></div>
  <div id="app"></div>
</div>

<script>
(function(){
  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  const tenant = params.get('tenant');
  const accessToken = params.get('token');
  const consentError = params.get('consent_error');

  function esc(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function scoreClass(score){
    if(score === null) return 'info';
    if(score >= 80) return 'good';
    if(score >= 50) return 'warn';
    return 'bad';
  }

  function renderLanding(errorMsg){
    app.innerHTML = `
      ${errorMsg ? `<div class="error-banner">${esc(errorMsg)}</div>` : ''}
      <h1>Check a Microsoft 365 tenant for the misconfigurations manual security audits keep finding.</h1>
      <p class="lede">Connect a tenant and get a scored report in about two minutes: baseline MFA enforcement, Conditional Access gaps, admin sprawl, guest access settings, and a few other checks that show up over and over in manual M365/Entra ID audits.</p>
      <p><button class="btn" id="connectBtn">Connect a Microsoft 365 tenant</button></p>
      <p class="note">Requires Global Administrator approval on the target tenant. Only read-only permissions are requested; nothing in the tenant is ever changed. Data is kept for 90 days and can be deleted at any time from the report page. See the <a href="/privacy.html">privacy policy</a> and <a href="/terms.html">terms</a>.</p>
      <p class="note">Manage more than one client tenant? <button class="link-btn" id="openDashboardLink">Open your dashboard</button></p>

      <h2>What it checks</h2>
      <div class="checks-grid">
        <div class="check-card"><div class="check-card-top"><h4>Baseline MFA enforcement</h4><span class="pill critical">critical</span></div></div>
        <div class="check-card"><div class="check-card-top"><h4>Global Admins without MFA</h4><span class="pill critical">critical</span></div></div>
        <div class="check-card"><div class="check-card-top"><h4>Conditional Access coverage</h4><span class="pill critical">critical</span></div></div>
        <div class="check-card"><div class="check-card-top"><h4>Break-glass account exclusion</h4><span class="pill high">high</span></div></div>
        <div class="check-card"><div class="check-card-top"><h4>Global Admin count</h4><span class="pill high">high</span></div></div>
        <div class="check-card"><div class="check-card-top"><h4>Guest invitation policy</h4><span class="pill high">high</span></div></div>
        <div class="check-card"><div class="check-card-top"><h4>MFA registration coverage</h4><span class="pill high">high</span></div></div>
        <div class="check-card"><div class="check-card-top"><h4>Admin consent workflow</h4><span class="pill low">low</span></div></div>
      </div>

      <h2>How it works</h2>
      <p style="color:var(--text-dim);">An admin approves read-only access on Microsoft's own consent screen. The scan reads Conditional Access policies, directory roles, MFA registration data, and guest settings through Microsoft Graph, then scores the tenant and lists each finding in plain language with a fix.</p>

      <h2>Pricing</h2>
      <div class="pricing-row">
        <div class="pricing-col">
          <h3>Free</h3>
          <div class="price">$0</div>
          <ul>
            <li>1 connected tenant</li>
            <li>Unlimited re-scans</li>
            <li>Full scored report</li>
            <li>90-day history + trend</li>
            <li>PDF export</li>
          </ul>
        </div>
        <div class="pricing-col highlight">
          <h3>Pro</h3>
          <div class="price">$49<span>/month</span></div>
          <ul>
            <li>Everything in Free</li>
            <li>Unlimited tenants on one dashboard</li>
            <li>Worst-scoring client shown first</li>
            <li>Weekly automatic re-scans</li>
            <li>Cancel anytime</li>
          </ul>
        </div>
      </div>

      <h2>Questions</h2>
      <dl class="faq">
        <div class="faq-item">
          <dt>What exact permissions does this request?</dt>
          <dd>Policy.Read.All, Directory.Read.All, RoleManagement.Read.Directory, Reports.Read.All, and AuditLog.Read.All. All read-only. There is no permission in the request that can modify, delete, or create anything in the tenant.</dd>
        </div>
        <div class="faq-item">
          <dt>Why is this free?</dt>
          <dd>Scanning a single tenant is free indefinitely. It pays for itself once an MSP manages more than one client and wants a dashboard instead of doing this tenant by tenant.</dd>
        </div>
        <div class="faq-item">
          <dt>What data is stored?</dt>
          <dd>The tenant ID, a private access token for viewing the report, and the scan results (tenant-level configuration and aggregate MFA registration percentages). No mailbox, file, or Teams content is ever accessed.</dd>
        </div>
        <div class="faq-item">
          <dt>Who can see my report?</dt>
          <dd>Only someone with the private link containing your access token. Treat that link like a password.</dd>
        </div>
      </dl>
    `;
    document.getElementById('connectBtn').addEventListener('click', startConsent);
    document.getElementById('openDashboardLink').addEventListener('click', () => {
      const key = prompt('Paste your dashboard key:');
      if(key) window.location.href = '/?msp=' + encodeURIComponent(key.trim());
    });
  }

  async function startConsent(){
    const btn = document.getElementById('connectBtn');
    btn.disabled = true;
    btn.textContent = 'Loading...';
    try{
      const res = await fetch('/api/config');
      const cfg = await res.json();
      if(!cfg.clientId){
        renderLanding('Server is not configured yet (missing AZURE_CLIENT_ID). See setup instructions.');
        return;
      }
      // Operator-facing only (not shown to visitors): client secret rotation reminder.
      if(cfg.secretWarning){ console.warn('[M365 Guardian]', cfg.secretWarning); }
      const redirectUri = window.location.origin + '/api/consent-callback';
      const url = 'https://login.microsoftonline.com/organizations/adminconsent'
        + '?client_id=' + encodeURIComponent(cfg.clientId)
        + '&scope=' + encodeURIComponent('https://graph.microsoft.com/.default')
        + '&redirect_uri=' + encodeURIComponent(redirectUri)
        + '&state=' + encodeURIComponent(cfg.state);
      window.location.href = url;
    }catch(e){
      renderLanding('Could not start the connect flow. Try again.');
    }
  }

  function renderLoading(){
    app.innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        Scanning tenant. Reading Conditional Access policies, admin roles, MFA registration, and guest settings.
      </div>
    `;
  }

  function renderDelta(report){
    if(typeof report.scoreDelta !== 'number') return '';
    const d = report.scoreDelta;
    const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
    const arrow = d > 0 ? '+' : d < 0 ? '-' : '';
    const label = d === 0 ? 'No change since last scan' : `${arrow}${Math.abs(d)} since last scan (was ${report.previousScore})`;
    return `<span class="score-delta ${cls}">${esc(label)}</span>`;
  }

  function renderTrend(history){
    if(!history || history.length < 2) return '';
    const bars = history.map(h => {
      const score = h.score;
      const height = score === null || score === undefined ? 4 : Math.max(4, Math.round(score / 100 * 28));
      const cls = score === null || score === undefined ? '' : score >= 80 ? 'good' : score >= 50 ? 'warn' : 'bad';
      const title = score === null || score === undefined ? 'N/A' : `${score} on ${new Date(h.scannedAt).toLocaleDateString()}`;
      return `<div class="trend-bar ${cls}" style="height:${height}px" title="${esc(title)}"></div>`;
    }).join('');
    return `<div class="trend-row">${bars}</div>`;
  }

  async function loadTrend(tenantId, tok){
    try{
      const res = await fetch('/api/history?tenant=' + encodeURIComponent(tenantId) + '&token=' + encodeURIComponent(tok));
      if(!res.ok) return;
      const data = await res.json();
      const el = document.getElementById('trendSlot');
      if(el) el.innerHTML = renderTrend(data.history);
    }catch(e){}
  }

  function renderReport(report, tenantId, tok){
    const cls = scoreClass(report.score);
    const displayName = report.tenantName ? esc(report.tenantName) : esc(tenantId);
    document.title = `M365 Guardian report: ${report.tenantName || tenantId}, score ${report.score ?? 'N/A'}`;
    const icons = {
      pass: '<svg width="11" height="11" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6" stroke="currentColor" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      fail: '<svg width="10" height="10" viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="3.4" fill="none" stroke-linecap="round"/></svg>',
      na: '<svg width="10" height="10" viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>',
    };
    const rows = report.findings.map(f => {
      const iconCls = f.passed === null ? 'na' : f.passed ? 'pass' : 'fail';
      const icon = icons[iconCls];
      const cardCls = f.passed === null ? '' : f.passed ? 'pass' : 'fail';
      return `
        <div class="finding ${cardCls}">
          <div class="finding-head">
            <span class="status-dot ${iconCls}">${icon}</span>
            <span class="finding-title">${esc(f.title)}</span>
            <span class="pill ${f.severity}">${esc(f.severity)}</span>
          </div>
          <p class="finding-detail">${esc(f.detail)}</p>
          ${f.remediation ? `<div class="finding-remediation">Fix: ${esc(f.remediation)}</div>` : ''}
        </div>
      `;
    }).join('');

    const ringColorVar = cls === 'good' ? 'var(--good)' : cls === 'warn' ? 'var(--warn)' : cls === 'bad' ? 'var(--bad)' : 'var(--info)';
    const ringStyle = `--pct:${report.score === null ? 0 : report.score};--ring-c:${ringColorVar};`;

    app.innerHTML = `
      <div class="card score-card">
        <div class="score-ring ${cls}" style="${ringStyle}"><span>${report.score === null ? 'N/A' : report.score}</span></div>
        <div class="score-meta">
          <h2>${displayName}</h2>
          <p>Scanned ${new Date(report.scannedAt).toLocaleString()}</p>
          ${renderDelta(report)}
          <div id="trendSlot"></div>
        </div>
      </div>
      <div class="findings">${rows}</div>
      <div class="footer-row">
        <button id="rescanBtn">Re-scan now</button>
        <button id="pdfBtn">Download PDF</button>
        <button id="newTenantBtn">Connect a different tenant</button>
        <button id="mspLinkBtn">Add to dashboard</button>
        <button id="disconnectBtn" class="danger">Disconnect and delete my data</button>
      </div>
      <div id="mspLinkResult"></div>
    `;
    document.getElementById('rescanBtn').addEventListener('click', () => runScan(tenantId, tok));
    document.getElementById('pdfBtn').addEventListener('click', () => window.print());
    document.getElementById('newTenantBtn').addEventListener('click', () => { window.location.href = '/'; });
    document.getElementById('disconnectBtn').addEventListener('click', () => disconnect(tenantId, tok));
    document.getElementById('mspLinkBtn').addEventListener('click', () => linkToMspDashboard(tenantId, tok));
  }

  async function linkToMspDashboard(tenantId, tok){
    const existingKey = prompt('If you manage multiple tenants, paste your existing dashboard key to add this one to it.\n\nLeave blank to create a new dashboard.');
    if(existingKey === null) return; // cancelled
    const label = prompt('Optional label for this tenant on your dashboard (e.g. client name). Leave blank to skip.') || null;

    try{
      const res = await fetch('/api/msp-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tenant: tenantId, token: tok, mspKey: existingKey || undefined, label })
      });
      const data = await res.json();
      const slot = document.getElementById('mspLinkResult');
      if(!res.ok){
        if(data.requiresUpgrade){
          slot.innerHTML = `
            <div class="msp-link-box">
              ${esc(data.error)}<br><br>
              <button id="upgradeFromLinkBtn" class="btn" style="padding:9px 16px;font-size:13.5px;">Upgrade to Pro, $49/month</button>
            </div>
          `;
          document.getElementById('upgradeFromLinkBtn').addEventListener('click', () => startUpgrade(data.mspKey));
          return;
        }
        slot.innerHTML = `<div class="msp-link-box">Could not link: ${esc(data.error || 'unknown error')}</div>`;
        return;
      }
      slot.innerHTML = `
        <div class="msp-link-box">
          ${data.alreadyLinked ? 'This tenant is already on that dashboard.' : 'Linked.'} Your dashboard key (save this, it is the only way back in):<br>
          <code>${esc(data.mspKey)}</code><br><br>
          <a href="/?msp=${encodeURIComponent(data.mspKey)}">Open dashboard &rarr;</a>
        </div>
      `;
    }catch(e){
      const slot = document.getElementById('mspLinkResult');
      slot.innerHTML = `<div class="msp-link-box">Request failed. Try again.</div>`;
    }
  }

  async function startUpgrade(mspKey){
    try{
      const res = await fetch('/api/create-checkout-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mspKey })
      });
      const data = await res.json();
      if(!res.ok || !data.url){
        alert(data.error || 'Could not start checkout.');
        return;
      }
      window.location.href = data.url;
    }catch(e){
      alert('Could not start checkout. Try again.');
    }
  }

  async function openBillingPortal(mspKey){
    try{
      const res = await fetch('/api/create-portal-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mspKey })
      });
      const data = await res.json();
      if(!res.ok || !data.url){
        alert(data.error || 'Could not open billing portal.');
        return;
      }
      window.location.href = data.url;
    }catch(e){
      alert('Could not open billing portal. Try again.');
    }
  }

  async function renderDashboard(mspKey){
    app.innerHTML = `<div class="loading"><div class="spinner"></div>Loading dashboard.</div>`;
    let data;
    try{
      const res = await fetch('/api/msp-dashboard?mspKey=' + encodeURIComponent(mspKey));
      data = await res.json();
      if(!res.ok){
        app.innerHTML = `<div class="error-banner">${esc(data.error || 'Could not load dashboard.')}</div><div class="footer-row"><button onclick="window.location.href='/'">Back to home</button></div>`;
        return;
      }
    }catch(e){
      app.innerHTML = `<div class="error-banner">Could not load dashboard. Check your connection and try again.</div>`;
      return;
    }

    const tenants = data.tenants || [];
    const isPro = !!data.isPro;
    const planBadge = `<span class="pill ${isPro ? 'low' : 'info'}" style="margin-left:10px;">${isPro ? 'pro' : 'free'}</span>`;

    if(tenants.length === 0){
      app.innerHTML = `
        <div class="dash-head"><h1>Dashboard${planBadge}</h1></div>
        <div class="empty-dash">No tenants linked to this dashboard yet.<br>Connect a tenant, scan it, then use "Add to dashboard" on its report page with this key.</div>
        <div class="footer-row"><button onclick="window.location.href='/'">Back to home</button></div>
      `;
      return;
    }

    const rows = tenants.map(t => {
      const cls = t.score === null ? 'na' : t.score >= 80 ? 'good' : t.score >= 50 ? 'warn' : 'bad';
      const name = t.label || t.tenantName || t.tenantId;
      const scanned = t.scannedAt ? new Date(t.scannedAt).toLocaleDateString() : 'not scanned yet';
      return `
        <div class="dash-row">
          <div class="dash-score ${cls}">${t.score === null ? 'N/A' : t.score}</div>
          <div class="dash-info">
            <h4>${esc(name)}</h4>
            <p>${esc(t.tenantId)}, last scanned ${esc(scanned)}</p>
          </div>
          <div class="dash-actions">
            <a href="/?tenant=${encodeURIComponent(t.tenantId)}&token=${encodeURIComponent(t.accessToken)}">View report</a>
            <button data-tenant="${esc(t.tenantId)}" class="unlinkBtn">Remove</button>
          </div>
        </div>
      `;
    }).join('');

    app.innerHTML = `
      <div class="dash-head">
        <h1>Dashboard${planBadge}</h1>
        <span style="color:var(--text-dim);font-size:13px;">${tenants.length} tenant${tenants.length === 1 ? '' : 's'}</span>
      </div>
      ${params.get('upgraded') === '1' ? '<div class="msp-link-box" style="border-color:var(--good);color:var(--good);margin-bottom:16px;">You are on Pro. Unlimited tenants unlocked.</div>' : ''}
      <p class="dash-key-note">Worst-scoring tenants shown first. This dashboard is only as private as your dashboard key: do not share the URL with anyone you do not want to see these scores.</p>
      ${isPro ? '' : `<div class="msp-link-box" style="margin-bottom:16px;">Free plan tracks 1 tenant. <button id="dashUpgradeBtn" class="link-btn">Upgrade to Pro, $49/month</button></div>`}
      <div class="dash-table">${rows}</div>
      <div class="footer-row">
        <button onclick="window.location.href='/'">Back to home</button>
        ${isPro ? '<button id="manageBillingBtn">Manage billing</button>' : ''}
      </div>
    `;

    if(!isPro){
      const upgradeBtn = document.getElementById('dashUpgradeBtn');
      if(upgradeBtn) upgradeBtn.addEventListener('click', () => startUpgrade(mspKey));
    } else {
      const billingBtn = document.getElementById('manageBillingBtn');
      if(billingBtn) billingBtn.addEventListener('click', () => openBillingPortal(mspKey));
    }

    document.querySelectorAll('.unlinkBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const tenantId = btn.getAttribute('data-tenant');
        if(!confirm('Remove this tenant from your dashboard? This does not disconnect the tenant itself.')) return;
        try{
          await fetch('/api/msp-unlink', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mspKey, tenant: tenantId })
          });
        }catch(e){}
        renderDashboard(mspKey);
      });
    });
  }

  async function disconnect(tenantId, tok){
    if(!confirm('This will delete all stored data for this tenant. You will need to reconnect to scan it again. Continue?')) return;
    try{
      await fetch('/api/disconnect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tenant: tenantId, token: tok })
      });
    }catch(e){}
    window.location.href = '/';
  }

  async function runScan(tenantId, tok){
    renderLoading();
    try{
      const res = await fetch('/api/scan?tenant=' + encodeURIComponent(tenantId) + '&token=' + encodeURIComponent(tok));
      const data = await res.json();
      if(!res.ok){
        renderLanding(data.error + (data.detail ? (': ' + data.detail) : ''));
        return;
      }
      renderReport(data, tenantId, tok);
      window.history.replaceState({}, '', '/?tenant=' + encodeURIComponent(tenantId) + '&token=' + encodeURIComponent(tok));
      loadTrend(tenantId, tok);
    }catch(e){
      renderLanding('Scan request failed. Check your connection and try again.');
    }
  }

  // Operator-facing check, independent of the connect flow, so the warning
  // shows up in the console on any page load, not just when someone clicks Connect.
  fetch('/api/config').then(r => r.json()).then(cfg => {
    if(cfg.secretWarning) console.warn('[M365 Guardian]', cfg.secretWarning);
  }).catch(() => {});

  // --- entry point ---
  const mspKey = params.get('msp');
  const justUpgraded = params.get('upgraded') === '1';
  if(mspKey){
    renderDashboard(mspKey).then(() => {
      if(justUpgraded){
        window.history.replaceState({}, '', '/?msp=' + encodeURIComponent(mspKey));
      }
    });
  } else if(consentError){
    renderLanding(consentError);
  } else if(tenant && accessToken){
    runScan(tenant, accessToken);
  } else {
    renderLanding(null);
  }
})();
</script>
</body>
</html>
